project:
  description: Ethos-U85 TFLM example and integration test

  connections:
    - connect: TFLM Ethos-U85 Test
      consumes:
        - STDOUT

  groups:
    - group: Documentation
      files:
        - file: ./README.md

    - group: Test
      files:
        - file: ./Source/test_main.cpp

  layers:
    - layer: ./Model/ML-Model.clayer.yml

    - layer: $Board-Layer$
      type: Board

  output:
    type:
      - elf
      - hex
      - map